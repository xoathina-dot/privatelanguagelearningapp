<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Γεια & Hallo</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#4a8a7e">
<meta name="background-color" content="#faf6f1">

<!-- iOS "Add to Home Screen" support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Γεια & Hallo">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="login-screen" class="login-screen">
  <div class="login-card">
    <div class="login-title">Γεια &amp; Hallo</div>
    <div class="login-sub">Private Lern-App für zwei</div>
    <form id="login-form">
      <input id="login-username" class="input" type="text" placeholder="Benutzername" autocomplete="username" required />
      <input id="login-password" class="input" type="password" placeholder="Passwort" autocomplete="current-password" required />
      <div id="login-error" class="login-error" hidden></div>
      <button type="submit" class="btn-primary">Einloggen</button>
    </form>
  </div>
</div>

<div id="app-root" class="app-root" hidden></div>

<script src="app.js"></script>
</body>
</html>
